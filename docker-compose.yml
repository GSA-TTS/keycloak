services:
  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_FEATURES: "token-exchange,admin-fine-grained-authz,admin-api,admin,authorization,ciba,client-policies,device-flow,impersonation,kerberos,login,organization,par,persistent-user-sessions,token-exchange-standard,user-event-metrics,client-secret-rotation,account-api,web-authn,passkeys"
      SKIP_WEBAUTHN_CONFIG: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: start --optimized --http-enabled=true
    develop:
      watch:
        # Sync theme files for hot reload - ideal for UI development
        - action: sync
          path: ./themes/src/main/resources/theme/usai
          target: /opt/keycloak/themes/usai
          ignore:
            - "**/*.class"
            - "**/target/"
        
        # Sync WebAuthn configuration scripts
        - action: sync
          path: ./webauthn-config
          target: /opt/keycloak/webauthn-config
          ignore:
            - "**/*.log"
        
        # Sync entrypoint script changes
        - action: sync
          path: ./entrypoint.sh
          target: /opt/keycloak/bin/entrypoint.sh
        
        # Rebuild when Maven POM files change (dependencies)
        - action: rebuild
          path: ./pom.xml
        
        - action: rebuild
          path: ./keycloak-login.gov-integration/pom.xml
        
        - action: rebuild
          path: ./themes/pom.xml
        
        - action: rebuild
          path: ./extensions/keycloak-api-key-demo/api-key-module/pom.xml
        
        - action: rebuild
          path: ./extensions/keycloak-api-key-demo/dashboard-service/pom.xml
        
        # Rebuild when Java source files change in extensions
        - action: rebuild
          path: ./keycloak-login.gov-integration/src
          ignore:
            - "**/*.class"
            - "**/target/"
        
        - action: rebuild
          path: ./extensions/keycloak-api-key-demo
          ignore:
            - "**/*.class"
            - "**/target/"
            - "**/*.log"
        
        # Rebuild when Dockerfile changes
        - action: rebuild
          path: ./Dockerfile

volumes:
  postgres_data:

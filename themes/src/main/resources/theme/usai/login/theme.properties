parent=base
import=common/keycloak

styles=css/login.css css/usai.css
stylesCommon=vendor/patternfly-v4/patternfly.min.css lib/pficon/pficon.css

locales=ar,ca,cs,da,de,en,es,fr,hu,it,ja,lt,nl,no,pl,pt-BR,ru,sk,sv,tr,zh-CN

# Override some base classes for USAi styling
kcHtmlClass=usai-html
kcBodyClass=usai-body
kcLoginClass=usai-login-page
kcFormCardClass=usa-card login-card
kcHeaderClass=usa-card__header
kcContentClass=usa-card__body
kcButtonClass=usa-button
kcButtonPrimaryClass=usa-button--primary
kcInputClass=usa-input
kcFormGroupClass=usa-form-group
kcLabelClass=usa-label

# Social provider classes
kcFormSocialAccountSectionClass=kc-social-section
kcFormSocialAccountListClass=kc-social-links
kcFormSocialAccountListButtonClass=usa-button usa-button--outline kc-social-item
kcFormSocialAccountNameClass=kc-social-provider-name
kcCommonLogoIdP=kc-social-provider-logo

# Identity provider icon classes
kcLogoIdP-facebook=fa fa-facebook
kcLogoIdP-google=fa fa-google
kcLogoIdP-github=fa fa-github
kcLogoIdP-linkedin=fa fa-linkedin
kcLogoIdP-instagram=fa fa-instagram
kcLogoIdP-microsoft=fa fa-windows
kcLogoIdP-bitbucket=fa fa-bitbucket
kcLogoIdP-gitlab=fa fa-gitlab
kcLogoIdP-paypal=fa fa-paypal
kcLogoIdP-stackoverflow=fa fa-stack-overflow
kcLogoIdP-twitter=fa fa-twitter
kcLogoIdP-openshift-v4=pf-icon pf-icon-openshift
kcLogoIdP-login-gov=fa fa-shield-alt
